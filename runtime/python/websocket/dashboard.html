<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunASR 控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .sidebar-item.active { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- 侧边栏 -->
        <div class="w-64 bg-white shadow-lg">
            <div class="p-6 border-b">
                <h1 class="text-xl font-bold text-gray-800">🎤 FunASR 控制台</h1>
            </div>
            <nav class="mt-6">
                <div class="px-3">
                    <a href="#" onclick="setActiveTab('dashboard')" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">📊</span>
                        控制台
                    </a>
                    <a href="#" onclick="setActiveTab('upload')" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">📁</span>
                        音频上传
                    </a>
                    <a href="/batch_processing" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">📦</span>
                        批量处理
                    </a>
                    <a href="#" onclick="setActiveTab('speakers')" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">👥</span>
                        说话人管理
                    </a>
                    <a href="#" onclick="setActiveTab('history')" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">📝</span>
                        转录历史
                    </a>
                    <a href="/performance_report" 
                       class="sidebar-item flex items-center px-3 py-2 rounded-lg mb-1 transition-colors">
                        <span class="mr-3">📊</span>
                        性能报告
                    </a>
                </div>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 overflow-hidden">
            <!-- 顶部状态栏 -->
            <div class="bg-white shadow-sm border-b px-6 py-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-800" id="pageTitle">控制台概览</h2>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <span class="text-sm text-gray-600">服务运行中</span>
                        </div>
                        <button onclick="refreshData()" class="px-3 py-1 bg-blue-500 text-white rounded-md text-sm hover:bg-blue-600">
                            🔄 刷新
                        </button>
                    </div>
                </div>
            </div>

            <!-- 内容区域 -->
            <div class="p-6 overflow-y-auto h-full">
                <!-- 控制台页面 -->
                <div id="dashboard-content" class="space-y-6">
                    <!-- 统计卡片 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow">
                            <div class="flex items-center">
                                <div class="p-2 bg-blue-100 rounded-lg">
                                    <span class="text-2xl">📊</span>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm text-gray-600">总转录次数</p>
                                    <p class="text-xl font-bold" id="total-transcriptions">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <div class="flex items-center">
                                <div class="p-2 bg-green-100 rounded-lg">
                                    <span class="text-2xl">⏱️</span>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm text-gray-600">总时长</p>
                                    <p class="text-xl font-bold" id="total-duration">0s</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <div class="flex items-center">
                                <div class="p-2 bg-purple-100 rounded-lg">
                                    <span class="text-2xl">👥</span>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm text-gray-600">注册说话人</p>
                                    <p class="text-xl font-bold" id="total-speakers">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <div class="flex items-center">
                                <div class="p-2 bg-yellow-100 rounded-lg">
                                    <span class="text-2xl">📅</span>
                                </div>
                                <div class="ml-4">
                                    <p class="text-sm text-gray-600">今日转录</p>
                                    <p class="text-xl font-bold" id="today-transcriptions">0</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 最近活动 -->
                    <div class="bg-white rounded-lg shadow">
                        <div class="p-6 border-b">
                            <h3 class="text-lg font-semibold">最近活动</h3>
                        </div>
                        <div class="p-6">
                            <div id="recent-activity" class="space-y-4">
                                <div class="text-center text-gray-500 py-8">
                                    暂无最近活动
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 音频上传页面 -->
                <div id="upload-content" class="space-y-6" style="display: none;">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">单文件上传</h3>
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center"
                             ondragover="event.preventDefault()" ondrop="handleFileDrop(event)">
                            <span class="text-4xl mb-4 block">📁</span>
                            <p class="text-gray-600 mb-4">拖拽音频文件到这里，或点击选择文件</p>
                            <input type="file" id="audioFile" accept=".mp3,.wav,.m4a,.aac,.flac,.ogg" 
                                   onchange="handleFileSelect(event)" style="display: none;">
                            <button onclick="document.getElementById('audioFile').click()" 
                                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                                选择文件
                            </button>
                        </div>
                        
                        <!-- 上传进度 -->
                        <div id="upload-progress" style="display: none;" class="mt-4">
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span id="progress-message">处理中...</span>
                                <span id="progress-percent">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all" style="width: 0%"></div>
                            </div>
                        </div>

                        <!-- 上传结果 -->
                        <div id="upload-result" style="display: none;" class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                            <h4 class="font-semibold text-green-800 mb-2">转录结果</h4>
                            <div id="result-content"></div>
                        </div>
                    </div>
                </div>



                <!-- 说话人管理页面 -->
                <div id="speakers-content" class="space-y-6" style="display: none;">
                    <!-- 注册新说话人 -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">注册新说话人</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">姓名</label>
                                <input type="text" id="speaker-name" placeholder="请输入说话人姓名"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">语音样本</label>
                                <input type="file" id="speaker-audio" accept=".mp3,.wav,.m4a,.aac,.flac,.ogg"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="flex items-end">
                                <button onclick="registerSpeaker()" 
                                        class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                                    ➕ 注册说话人
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 已注册说话人列表 -->
                    <div class="bg-white rounded-lg shadow">
                        <div class="p-6 border-b">
                            <h3 class="text-lg font-semibold">已注册说话人</h3>
                        </div>
                        <div class="p-6">
                            <div id="speakers-list">
                                <div class="text-center text-gray-500 py-8">
                                    暂无注册的说话人
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 转录历史页面 -->
                <div id="history-content" class="space-y-6" style="display: none;">
                    <div class="bg-white rounded-lg shadow">
                        <div class="p-6 border-b">
                            <div class="flex justify-between items-center">
                                <h3 class="text-lg font-semibold">转录历史</h3>
                                <select id="history-filter" onchange="loadHistory()" 
                                        class="px-3 py-1 border border-gray-300 rounded-md text-sm">
                                    <option value="">全部状态</option>
                                    <option value="completed">已完成</option>
                                    <option value="processing">处理中</option>
                                    <option value="error">错误</option>
                                </select>
                            </div>
                        </div>
                        <div class="p-6">
                            <div id="history-list">
                                <div class="text-center text-gray-500 py-8">
                                    暂无转录历史
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeTab = 'dashboard';

        function setActiveTab(tab) {
            // 更新URL锚点（不触发页面跳转）
            if (window.location.hash.substring(1) !== tab) {
                window.history.pushState(null, null, '#' + tab);
            }
            
            // 更新侧边栏样式
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
            });
            if (event && event.target) {
                event.target.closest('.sidebar-item').classList.add('active');
            } else {
                // 如果没有event（比如通过URL锚点访问），手动找到对应的导航项
                const navItem = document.querySelector(`[onclick="setActiveTab('${tab}')"]`);
                if (navItem) {
                    navItem.classList.add('active');
                }
            }

            // 隐藏所有内容
            document.querySelectorAll('[id$="-content"]').forEach(content => {
                content.style.display = 'none';
            });

            // 显示选中的内容
            document.getElementById(tab + '-content').style.display = 'block';
            
            // 更新标题
            const titles = {
                dashboard: '控制台概览',
                upload: '音频上传',
                batch: '批量处理',
                speakers: '说话人管理',
                history: '转录历史'
            };
            document.getElementById('pageTitle').textContent = titles[tab] || '';

            activeTab = tab;

            // 加载对应数据
            if (tab === 'speakers') {
                loadSpeakers();
            } else if (tab === 'history') {
                loadHistory();
            }
        }

        async function refreshData() {
            try {
                const response = await fetch('/api/statistics');
                const stats = await response.json();
                
                document.getElementById('total-transcriptions').textContent = stats.total_transcriptions || 0;
                document.getElementById('total-duration').textContent = formatDuration(stats.total_duration || 0);
                document.getElementById('total-speakers').textContent = stats.total_speakers || 0;
                document.getElementById('today-transcriptions').textContent = stats.today_transcriptions || 0;
                
                // 加载最近活动
                const historyResponse = await fetch('/api/transcription_history?limit=5');
                const recentHistory = await historyResponse.json();
                displayRecentActivity(recentHistory);
            } catch (error) {
                console.error('刷新数据失败:', error);
            }
        }

        function displayRecentActivity(history) {
            const container = document.getElementById('recent-activity');
            if (history.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无最近活动</div>';
                return;
            }

            container.innerHTML = history.map(item => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl">🎵</span>
                        <div>
                            <p class="font-medium">${item.filename}</p>
                            <p class="text-sm text-gray-600">${formatDate(item.created_at)}</p>
                        </div>
                    </div>
                    <span class="px-2 py-1 text-xs rounded-full ${getStatusClass(item.status)}">
                        ${getStatusText(item.status)}
                    </span>
                </div>
            `).join('');
        }

        function handleFileDrop(event) {
            event.preventDefault();
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        }

        async function uploadFile(file) {
            const progressDiv = document.getElementById('upload-progress');
            const resultDiv = document.getElementById('upload-result');
            
            progressDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            
            updateProgress(0, '准备上传...');

            const formData = new FormData();
            formData.append('audio_file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    updateProgress(100, '上传完成，正在处理...');
                    
                    // 轮询获取结果
                    pollTaskResult(result.task_id);
                } else {
                    throw new Error('上传失败');
                }
            } catch (error) {
                progressDiv.style.display = 'none';
                alert('上传失败: ' + error.message);
            }
        }

        async function pollTaskResult(taskId) {
            const poll = async () => {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    const result = await response.json();
                    
                    if (result.status === 'completed') {
                        document.getElementById('upload-progress').style.display = 'none';
                        displayResult(result.results);
                        refreshData();
                    } else if (result.status === 'error') {
                        document.getElementById('upload-progress').style.display = 'none';
                        alert('处理失败: ' + result.error);
                    } else {
                        updateProgress(result.progress || 50, result.message || '处理中...');
                        setTimeout(poll, 1000);
                    }
                } catch (error) {
                    console.error('轮询状态失败:', error);
                    setTimeout(poll, 2000);
                }
            };
            poll();
        }

        function updateProgress(percent, message) {
            document.getElementById('progress-percent').textContent = percent + '%';
            document.getElementById('progress-message').textContent = message;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        function displayResult(results) {
            const resultDiv = document.getElementById('upload-result');
            const contentDiv = document.getElementById('result-content');
            
            let html = '';
            
            if (results.transcription_text) {
                html += `<p class="text-gray-700 mb-4">${results.transcription_text}</p>`;
            }
            
            if (results.speaker_results && results.speaker_results.length > 0) {
                html += '<h5 class="font-medium mb-2">说话人分离结果：</h5>';
                html += '<div class="space-y-2">';
                results.speaker_results.forEach((segment, index) => {
                    html += `
                        <div class="p-3 bg-white rounded border">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-medium">片段 ${index + 1}</span>
                                <span class="text-sm text-gray-500">${segment.start_time.toFixed(2)}s - ${segment.end_time.toFixed(2)}s</span>
                            </div>
                            <p class="text-gray-700 mb-2">${segment.text}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-medium">${segment.speaker_name || '未知说话人'}</span>
                                ${segment.similarity_score ? `<span class="text-xs text-gray-500">相似度: ${(segment.similarity_score * 100).toFixed(1)}%</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            contentDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        async function registerSpeaker() {
            const name = document.getElementById('speaker-name').value.trim();
            const audioFile = document.getElementById('speaker-audio').files[0];

            if (!name || !audioFile) {
                alert('请填写说话人姓名并选择语音样本');
                return;
            }

            const formData = new FormData();
            formData.append('speaker_name', name);
            formData.append('speaker_audio', audioFile);

            try {
                const response = await fetch('/api/register_speaker', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('说话人注册成功！');
                    document.getElementById('speaker-name').value = '';
                    document.getElementById('speaker-audio').value = '';
                    loadSpeakers();
                } else {
                    const error = await response.text();
                    alert('注册失败: ' + error);
                }
            } catch (error) {
                alert('注册失败: ' + error.message);
            }
        }

        async function loadSpeakers() {
            try {
                const response = await fetch('/api/speakers');
                const data = await response.json();
                const speakers = data.speakers || [];
                
                const container = document.getElementById('speakers-list');
                if (speakers.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无注册的说话人</div>';
                    return;
                }

                container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">' +
                    speakers.map(speaker => `
                        <div class="p-4 border border-gray-200 rounded-lg">
                            <div class="flex items-center justify-between mb-3">
                                <h4 class="font-semibold">${speaker.name}</h4>
                                <button onclick="deleteSpeaker('${speaker.id}')" 
                                        class="text-red-500 hover:text-red-700">
                                    🗑️
                                </button>
                            </div>
                            <div class="text-sm text-gray-600 space-y-1">
                                <p>ID: ${speaker.id.substring(0, 8)}</p>
                                <p>注册时间: ${formatDate(speaker.created_at)}</p>
                            </div>
                        </div>
                    `).join('') + '</div>';
            } catch (error) {
                console.error('加载说话人列表失败:', error);
            }
        }

        async function deleteSpeaker(speakerId) {
            if (!confirm('确定要删除这个说话人吗？')) return;

            try {
                const response = await fetch(`/api/speakers/${speakerId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadSpeakers();
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        }

        async function loadHistory() {
            try {
                const filter = document.getElementById('history-filter').value;
                const url = filter ? `/api/transcription_history?status=${filter}` : '/api/transcription_history';
                const response = await fetch(url);
                const history = await response.json();
                
                const container = document.getElementById('history-list');
                if (history.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无转录历史</div>';
                    return;
                }

                container.innerHTML = '<div class="space-y-4">' +
                    history.map(item => `
                        <div class="p-4 border border-gray-200 rounded-lg">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex-1">
                                    <h4 class="font-semibold">${item.filename}</h4>
                                    <p class="text-sm text-gray-600">${formatDate(item.created_at)}</p>
                                </div>
                                <span class="px-2 py-1 text-xs rounded-full ${getStatusClass(item.status)}">
                                    ${getStatusText(item.status)}
                                </span>
                            </div>
                            ${item.transcription_text ? `<p class="text-gray-700 text-sm">${item.transcription_text.substring(0, 200)}${item.transcription_text.length > 200 ? '...' : ''}</p>` : ''}
                            <div class="mt-2 flex space-x-4 text-xs text-gray-500">
                                ${item.duration ? `<span>时长: ${formatDuration(item.duration)}</span>` : ''}
                                ${item.processing_time ? `<span>处理时间: ${item.processing_time.toFixed(2)}s</span>` : ''}
                                ${item.file_size ? `<span>大小: ${formatFileSize(item.file_size)}</span>` : ''}
                            </div>
                        </div>
                    `).join('') + '</div>';
            } catch (error) {
                console.error('加载转录历史失败:', error);
            }
        }

        function formatDuration(seconds) {
            if (!seconds) return '0s';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes}m ${secs}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleString('zh-CN');
        }

        function getStatusText(status) {
            const statusMap = {
                pending: '等待中',
                processing: '处理中',
                completed: '已完成',
                error: '错误'
            };
            return statusMap[status] || status;
        }

        function getStatusClass(status) {
            const classMap = {
                completed: 'bg-green-100 text-green-800',
                processing: 'bg-yellow-100 text-yellow-800',
                error: 'bg-red-100 text-red-800',
                pending: 'bg-gray-100 text-gray-800'
            };
            return classMap[status] || 'bg-gray-100 text-gray-800';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查URL锚点，如果有则跳转到对应页面
            const hash = window.location.hash.substring(1);
            if (hash && ['dashboard', 'upload', 'speakers', 'history'].includes(hash)) {
                setActiveTab(hash);
            } else {
                setActiveTab('dashboard');
            }
            refreshData();
        });

        // 监听浏览器前进后退按钮
        window.addEventListener('popstate', function(event) {
            const hash = window.location.hash.substring(1);
            if (hash && ['dashboard', 'upload', 'speakers', 'history'].includes(hash)) {
                setActiveTab(hash);
            } else {
                setActiveTab('dashboard');
            }
        });
    </script>
